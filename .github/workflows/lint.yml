name: Lint and Typecheck

# Runs ESLint, the TypeScript compiler and a production build on every push/PR.
# Unlike the Cloudflare Pages check, this needs no secrets, so it also gives real
# signal on Dependabot PRs (which run without access to repository secrets) when
# they bump eslint, typescript-eslint, typescript or vite.

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
