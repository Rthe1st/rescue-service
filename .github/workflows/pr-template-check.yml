name: PR Template Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-template-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read
  pull-requests: read

jobs:
  check-description:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify PR description follows template and links to current deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const headSha = pr.head.sha;

            const { data: templateFile } = await github.rest.repos.getContent({
              owner,
              repo,
              path: ".github/PULL_REQUEST_TEMPLATE.md",
              ref: pr.base.sha,
            });
            const template = Buffer.from(templateFile.content, "base64").toString("utf8");

            const stripComments = (text) => text.replace(/<!--[\s\S]*?-->/g, "").trim();

            const parseSections = (markdown) => {
              const lines = markdown.split("\n");
              const sections = [];
              let current = null;
              for (const line of lines) {
                if (/^#{1,6}\s+.+$/.test(line)) {
                  current = { header: line.trim(), body: [] };
                  sections.push(current);
                } else if (current) {
                  current.body.push(line);
                }
              }
              return sections.map((s) => ({ header: s.header, body: s.body.join("\n") }));
            };

            const templateSections = parseSections(template);
            const body = pr.body || "";
            const bodySections = parseSections(body);

            const problems = [];

            for (const { header } of templateSections) {
              const match = bodySections.find((s) => s.header === header);
              if (!match) {
                problems.push(
                  `Missing section "${header}" — the PR description must follow the template in .github/PULL_REQUEST_TEMPLATE.md.`
                );
                continue;
              }
              if (stripComments(match.body).length === 0) {
                problems.push(`Section "${header}" is still empty — please fill it in.`);
              }
            }

            const previewHeader = templateSections.find((s) => /preview deployment/i.test(s.header));
            let bodyUrl = null;
            if (previewHeader) {
              const previewSection = bodySections.find((s) => s.header === previewHeader.header);
              if (previewSection) {
                const urlMatch = stripComments(previewSection.body).match(/https?:\/\/\S+/);
                bodyUrl = urlMatch ? urlMatch[0].replace(/[.,)\]]+$/, "") : null;
                if (!bodyUrl) {
                  problems.push(
                    `Section "${previewHeader.header}" must contain a link to the Cloudflare Pages deployment URL.`
                  );
                } else {
                  try {
                    if (!new URL(bodyUrl).hostname.endsWith(".pages.dev")) {
                      problems.push(
                        `The preview deployment link "${bodyUrl}" doesn't look like a Cloudflare Pages URL (expected a *.pages.dev host).`
                      );
                      bodyUrl = null;
                    }
                  } catch {
                    problems.push(`The preview deployment link "${bodyUrl}" is not a valid URL.`);
                    bodyUrl = null;
                  }
                }
              }
            }

            if (bodyUrl) {
              const deadline = Date.now() + 5 * 60 * 1000;
              let deploymentUrl = null;
              while (Date.now() < deadline && !deploymentUrl) {
                const { data: deployments } = await github.rest.repos.listDeployments({
                  owner,
                  repo,
                  sha: headSha,
                  per_page: 100,
                });
                for (const deployment of deployments) {
                  const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                    owner,
                    repo,
                    deployment_id: deployment.id,
                    per_page: 10,
                  });
                  const success = statuses.find((s) => s.state === "success" && s.environment_url);
                  if (success) {
                    deploymentUrl = success.environment_url;
                    break;
                  }
                }
                if (!deploymentUrl) {
                  await new Promise((resolve) => setTimeout(resolve, 15000));
                }
              }

              if (!deploymentUrl) {
                problems.push(
                  `No successful Cloudflare Pages deployment was found for the current HEAD commit (${headSha.slice(0, 7)}). ` +
                    `Wait for the "Cloudflare Pages Deployment Check" workflow to finish, then update the PR description and re-run this check.`
                );
              } else if (deploymentUrl !== bodyUrl) {
                problems.push(
                  `The preview deployment link in the description is stale. It must point to the deployment for the ` +
                    `current HEAD commit (${headSha.slice(0, 7)}): ${deploymentUrl}`
                );
              }
            }

            if (problems.length > 0) {
              core.setFailed(
                "PR description does not follow the required template:\n\n" +
                  problems.map((p) => `- ${p}`).join("\n")
              );
            } else {
              core.info("PR description follows the template and links to the current deployment.");
            }
