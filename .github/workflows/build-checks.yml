name: Build Checks

# Typecheck, lint, and build the game, then load the production build in a
# browser and fail on any console error. This needs no secrets, so it also
# gives real signal on Dependabot PRs, where the Cloudflare Pages deployment
# can't run. It is what catches toolchain upgrades (TypeScript, ESLint, Vite)
# that break the build.

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check production build loads with no console errors
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4173 && break
            sleep 1
          done
          node scripts/check-deployment.mjs http://localhost:4173
